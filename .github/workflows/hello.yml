name: Print Hello
on:
  pull_request:
  push:
    branches:
      - main
      - foobar
      - hauptzweig
    tags:
      - f*

jobs:
  print_hello:
    name: "Print Hello"
    runs-on: ubuntu-latest
    env:
      REF_TYPE: ${{ github.ref_type }}
      DUMMY: ${{ secrets.DUMMY_SECRET }}
      MERGEBOT_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
      LIMIT: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha}}
    steps:
      - name: Print Hello
        run: |
          id
          echo "Hello World"
          echo ${DUMMY}|md5sum -
          echo ${MERGEBOT_TOKEN}|md5sum -          

      - name: Print on Push to foobar
        if: ${{ github.event_name == 'push' && github.event.ref == 'refs/heads/foobar' }}
        run: echo "Hello on push ${{ github.event.ref }}"

      - name: Checkout repo
        uses: actions/checkout@v5
  
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          architecture: x64
          cache: 'pip'
      - run: pip install pyyaml

      - name: Run GQL query
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          cd .github/scripts
          python3 -c "from trymerge import GitHubPR; print(GitHubPR('pytorch', 'pytorch', 159820))"
