name: Install torch on macos-latest

on:
  push:
    branches:
      - hauptzweig
    paths:
      - .github/workflows/install_torch.yml
  workflow_dispatch:

jobs:
  install_torch:
    runs-on: macos-15
    steps:
      - name: Install Python-3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install PyTorch
        shell: bash -l {0}
        run: |
          pip install torch
      - name: Run Python script
        shell: python {0}
        run: |
          import torch
          print(torch.__version__)
          x= torch.rand(3, 3)
          print(x.sum())
