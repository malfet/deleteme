name: Install torch on macos-latest

on:
  pull_request:
      paths:
      - .github/workflows/install_torch.yml
  push:
    branches:
      - hauptzweig
    paths:
      - .github/workflows/install_torch.yml
  workflow_dispatch:

jobs:
  install_torch:
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "macos-15"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Python-3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          allow-prereleases: true
      - name: Print Python version
        shell: bash {0}
        run:  python --version
      - name: Print Python3 version
        shell: bash -l {0}
        run:  python3 --version
      - name: Print Environment
        shell: bash -l {0}
        run:  env
      - name: Install PyTorch and Numpy
        shell: bash {0}
        run:  pip install torch==2.15.0 numpy
      - name: Run Python script
        shell: python {0}
        run: |
          import torch

          print(f"torch version is {torch.__version__}")
          lib = torch.mps.compile_shader("""
          using namespace metal;

          kernel void nan_swap(device atomic_int* data [[buffer(0)]],
                               device uint* loops [[buffer(1)]],
                               uint tid [[thread_position_in_grid]]) {
            data += tid & 3;
            float desired = (tid & 1) ? float(tid) : NAN;
            int expected = atomic_load_explicit(data, memory_order_relaxed);
            uint n = 0;
            while (n++ < 1000 && !atomic_compare_exchange_weak_explicit(
                       data, &expected, as_type<int>(desired), memory_order_relaxed, memory_order_relaxed)) {
            }
            loops[tid] = n;
          }
          """)

          N = 1024
          data = torch.arange(4.0, device="mps")
          loops = torch.zeros(N, dtype=torch.int32, device="mps")
          lib.nan_swap(data, loops, threads=N)
          print("max loops:", loops.max().item(), "final values:", data)
